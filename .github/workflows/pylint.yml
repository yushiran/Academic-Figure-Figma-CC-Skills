name: Pylint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned pylint and script dependencies
        run: pip install "pylint==3.3.*" matplotlib pyyaml
      - name: Run pylint
        run: pylint $(git ls-files '*.py')
      - name: Validate SKILL.md frontmatter (real YAML parse)
        run: python -c "import yaml; d=yaml.safe_load(open('academic-figure-figma/SKILL.md').read().split('---')[1]); assert d and 'name' in d and 'description' in d"
